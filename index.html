<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The title, description and share text come from `seo.home` in src/data/site.js.
         The build fills these placeholders in, and also adds the canonical address, the
         share image, the structured data and the sitemap once the site's domain is known
         (see seoFiles in vite.config.ts). -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DYMUN '26" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image:alt" content="DYMUN '26, D Y Patil International School, Navi Mumbai" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />

    <!-- DM Sans, the only typeface on the site, served from this site (public/fonts). -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/DMSans-Variable.ttf" crossorigin />
    <!-- Keeps the first paint dark while the stylesheet and script load. -->
    <style>
      html {
        background: #0a0a0a;
      }
      #boot-error {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 1.25rem;
        font: 500 0.9rem / 1.5 "DM Sans", system-ui, sans-serif;
        text-align: center;
        color: #ede6d6;
        background: #141414;
      }
    </style>
    <script>
      // If the page cannot start (an old browser, a blocked file), say so on screen
      // instead of leaving a dark page. React replaces the empty #shell once it starts.
      (function () {
        function show(message) {
          var shell = document.getElementById('shell')
          if (!shell) return
          var note = document.getElementById('boot-error')
          if (!note) {
            note = document.createElement('p')
            note.id = 'boot-error'
            shell.parentNode.appendChild(note)
          }
          note.textContent = message
        }
        window.addEventListener('error', function (event) {
          show('This page could not start in this browser. Please update the browser or try Chrome. Details: ' + (event.message || 'script error'))
        })
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          show('This page could not start in this browser. Please update the browser or try Chrome. Details: ' + String((reason && reason.message) || reason))
        })
        window.setTimeout(function () {
          show('This page is taking a long time to start. Please check the connection and reload.')
        }, 12000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><div id="shell"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
