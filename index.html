<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The title, description and share text come from `seo.home` in src/data/site.js.
         The build fills these placeholders in, and also adds the canonical address, the
         share image, the structured data and the sitemap once the site's domain is known
         (see seoFiles in vite.config.ts). -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DYMUN '26" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image:alt" content="DYMUN '26, D Y Patil International School, Navi Mumbai" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint: preload, then switch the stylesheet on. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..1000&family=Fraunces:ital,opsz,wght@1,9..144,400..600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..1000&family=Fraunces:ital,opsz,wght@1,9..144,400..600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..1000&family=Fraunces:ital,opsz,wght@1,9..144,400..600&display=swap"
      />
    </noscript>
    <!-- Keeps the first paint dark while the stylesheet and script load. -->
    <style>
      html {
        background: #0a0a0a;
      }
      /* Painted straight from the HTML, so something is on screen before the script runs.
         React replaces it as soon as the page mounts. */
      #shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 900 min(28vw, 40vh) / 1 system-ui, sans-serif;
        letter-spacing: -0.04em;
        color: #1d1809;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="shell">DYMUN</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
